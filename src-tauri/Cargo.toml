[package]
name = "ai-research-pdf-reader"
version = "0.5.9"
description = "Local scientific PDF reader"
authors = ["AI Research Studio"]
publish = false
edition = "2021"
rust-version = "1.90"

[lib]
name = "ai_research_pdf_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

sha2 = "0.10"
walkdir = "2"
serde = { version = "1", features = ["derive"] }

tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"

# V0.4.2 — official Azure REST client and Windows Credential Manager
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
serde_json = "1"

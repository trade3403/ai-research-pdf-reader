name: D line - RPTranslate CPU CI
on:
  push:
    branches: [feature/rptranslate]
    paths:
      - 'rptranslate/**'
      - '.github/workflows/rptranslate-ci.yml'
  pull_request:
    paths:
      - 'rptranslate/**'
      - '.github/workflows/rptranslate-ci.yml'
permissions:
  contents: read
concurrency:
  group: rptranslate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cpu-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rptranslate
    env:
      CARGO_NET_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --offline --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked --offline --workspace
      - name: Release CPU build
        run: cargo build --locked --offline --release -p rptranslate
      - name: Smoke test
        run: ./target/release/rptranslate self-check

      - name: Forced portable fallback tests
        run: cargo test --locked --offline -p rpinfer --features portable-only
      - name: Independent INT8 mathematical reference
        if: contains(github.event.head_commit.message, 'D1.9a') || contains(github.event.head_commit.message, 'D1.9b') || contains(github.event.head_commit.message, 'D1.9c') || contains(github.event.head_commit.message, 'D1.9d') || contains(github.event.head_commit.message, 'D1.9e') || contains(github.event.head_commit.message, 'D1.9f') || contains(github.event.head_commit.message, 'D1.9g') || contains(github.event.head_commit.message, 'D1.9h') || contains(github.event.head_commit.message, 'D1.10a')
        run: |
          cargo build --locked --offline --release -p rpinfer --example int8_reference
          python3 crates/rpinfer/tests/check_int8_reference.py target/release/examples/int8_reference
      - name: Independent RPQ8 binary format reference
        if: contains(github.event.head_commit.message, 'D1.9b') || contains(github.event.head_commit.message, 'D1.9c') || contains(github.event.head_commit.message, 'D1.9d') || contains(github.event.head_commit.message, 'D1.9e') || contains(github.event.head_commit.message, 'D1.9f') || contains(github.event.head_commit.message, 'D1.9g') || contains(github.event.head_commit.message, 'D1.9h') || contains(github.event.head_commit.message, 'D1.10a')
        run: |
          cargo build --locked --offline --release -p rpmodel --example quantized_reference
          python3 crates/rpmodel/tests/check_quantized_format.py target/release/examples/quantized_reference
      - name: Matrix release benchmark
        if: contains(github.event.head_commit.message, 'D1.4a') || contains(github.event.head_commit.message, 'D1.4b')
        run: |
          lscpu | grep -E 'Model name:|^CPU\(s\):' || true
          cargo run --locked --offline --release -p rpinfer --example matmul_bench

  model-tokenizer-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, 'D1.2b1') || contains(github.event.head_commit.message, 'D1.2b2a') || (contains(github.event.head_commit.message, 'D1.2b2b1') || contains(github.event.head_commit.message, 'D1.2b2b2')))
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download pinned public tokenizer files only
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/rp-tokenizer"
          for file in source.spm target.spm vocab.json; do
            curl --fail --location --max-time 40 --max-filesize 16777216 --output "$RUNNER_TEMP/rp-tokenizer/$file" "https://huggingface.co/Helsinki-NLP/opus-mt-en-zh/resolve/7b05ad2cd70ad11863b0fffc3327c13a26ab4f8a/$file"
          done
          sha256sum "$RUNNER_TEMP/rp-tokenizer/"*
      - name: Inspect actual SPM metadata (not translation)
        working-directory: rptranslate
        run: |
          cargo run --locked --offline -p rpmodel --example inspect_spm -- "$RUNNER_TEMP/rp-tokenizer/source.spm"
          cargo run --locked --offline -p rpmodel --example inspect_spm -- "$RUNNER_TEMP/rp-tokenizer/target.spm"

      - name: Verify pinned tokenizer checksums
        run: |
          cd "$RUNNER_TEMP/rp-tokenizer"
          sha256sum -c <<'EOF'
          5775ddc9e3ff2fae91554da56468ad35ff56edaba870fea74447bc7234bfdaa8  source.spm
          81dc94efa84e4025ef38d25d5d07429fe41e3eb29d44003f1db6fe98487b0052  target.spm
          f1832ca38f7aa158b9a944ff583e4901e6b37d9d4ad9241f03838e636e9cfb03  vocab.json
          EOF
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare actual model normalization
        if: contains(github.event.head_commit.message, 'D1.2b2a') || (contains(github.event.head_commit.message, 'D1.2b2b1') || contains(github.event.head_commit.message, 'D1.2b2b2'))
        working-directory: rptranslate
        run: |
          python3 -m venv "$RUNNER_TEMP/spm-reference"
          "$RUNNER_TEMP/spm-reference/bin/pip" install --disable-pip-version-check --only-binary=:all: sentencepiece==0.2.1
          cargo build --locked --offline -p rpmodel --example normalize_spm
          "$RUNNER_TEMP/spm-reference/bin/python" crates/rpmodel/tests/check_real_normalization.py "$RUNNER_TEMP/rp-tokenizer"

      - name: Compare actual SentencePiece IDs and decoding
        if: (contains(github.event.head_commit.message, 'D1.2b2b1') || contains(github.event.head_commit.message, 'D1.2b2b2'))
        working-directory: rptranslate
        run: |
          cargo build --locked --offline -p rpmodel --example tokenize_spm
          "$RUNNER_TEMP/spm-reference/bin/python" crates/rpmodel/tests/check_real_spm_ids.py "$RUNNER_TEMP/rp-tokenizer"

      - name: Compare Marian network tokenizer
        if: contains(github.event.head_commit.message, 'D1.2b2b2')
        working-directory: rptranslate
        run: |
          "$RUNNER_TEMP/spm-reference/bin/pip" install --disable-pip-version-check --only-binary=:all: transformers==4.48.3
          cargo build --locked --offline -p rpmodel --example marian_codec
          "$RUNNER_TEMP/spm-reference/bin/python" crates/rpmodel/tests/check_real_marian.py "$RUNNER_TEMP/rp-tokenizer"

  marian-forward-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, 'D1.6e') || contains(github.event.head_commit.message, 'D1.7b1') || contains(github.event.head_commit.message, 'D1.7b2') || contains(github.event.head_commit.message, 'D1.8b'))
    defaults:
      run:
        working-directory: rptranslate
    env:
      CARGO_NET_OFFLINE: 'true'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU reference only
        run: |
          python -m venv "$RUNNER_TEMP/marian-ref"
          "$RUNNER_TEMP/marian-ref/bin/pip" install --disable-pip-version-check --only-binary=:all: torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/marian-ref/bin/pip" install --disable-pip-version-check --only-binary=:all: transformers==4.48.3 numpy==2.2.6
      - name: Compare independent Marian forward traces
        run: |
          cargo build --locked --offline --release -p rpinfer --example marian_reference
          "$RUNNER_TEMP/marian-ref/bin/python" crates/rpinfer/tests/check_marian_reference.py "$RUNNER_TEMP/marian-weights.txt" target/release/examples/marian_reference
      - name: Probe pinned OPUS-MT generation metadata
        if: contains(github.event.head_commit.message, 'D1.7b2')
        run: |
          cargo build --locked --offline --release -p rpinfer --example marian_generation_config
          "$RUNNER_TEMP/marian-ref/bin/python" crates/rpinfer/tests/probe_marian_generation.py target/release/examples/marian_generation_config
      - name: D1.8a verify pinned real checkpoint (one bounded download)
        if: contains(github.event.head_commit.message, 'D1.8a')
        run: |
          "$RUNNER_TEMP/marian-ref/bin/python" crates/rpinfer/tests/probe_real_checkpoint.py "$RUNNER_TEMP/opus-mt-en-zh"

  real-model-conversion:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ contains(github.event.head_commit.message, 'D1.9h-paper') && 25 || 15 }}
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, 'D1.8c1') || contains(github.event.head_commit.message, 'D1.8c2') || contains(github.event.head_commit.message, 'D1.8c3') || contains(github.event.head_commit.message, 'D1.8c4') || contains(github.event.head_commit.message, 'D1.8c5') || contains(github.event.head_commit.message, 'D1.8c6') || contains(github.event.head_commit.message, 'D1.8c7') || contains(github.event.head_commit.message, 'D1.8d') || contains(github.event.head_commit.message, 'D1.8e') || contains(github.event.head_commit.message, 'D1.8f') || contains(github.event.head_commit.message, 'D1.10a'))
    defaults:
      run:
        working-directory: rptranslate
    env:
      CARGO_NET_OFFLINE: 'true'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned conversion-only tools
        run: |
          python -m venv "$RUNNER_TEMP/rp-convert"
          "$RUNNER_TEMP/rp-convert/bin/pip" install --disable-pip-version-check --only-binary=:all: torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/rp-convert/bin/pip" install --disable-pip-version-check --only-binary=:all: numpy==2.2.6 safetensors==0.7.0 packaging==24.2
      - name: Download and verify one official checkpoint
        run: |
          "$RUNNER_TEMP/rp-convert/bin/python" crates/rpinfer/tests/probe_real_checkpoint.py "$RUNNER_TEMP/opus-source"
      - name: Convert offline to RPModel v1
        run: |
          "$RUNNER_TEMP/rp-convert/bin/python" tools/convert_opus_checkpoint.py "$RUNNER_TEMP/opus-source" "$RUNNER_TEMP/rpmodel-v1"
      - name: Compare every converted FP32 bit through Rust
        run: |
          cargo build --locked --offline --release -p rpmodel --example stream_weights
          "$RUNNER_TEMP/rp-convert/bin/python" crates/rpinfer/tests/check_converted_checkpoint.py "$RUNNER_TEMP/opus-source" "$RUNNER_TEMP/rpmodel-v1" target/release/examples/stream_weights
      - name: Validate actual RPModel package through Rust
        if: contains(github.event.head_commit.message, 'D1.8c2') || contains(github.event.head_commit.message, 'D1.8c3') || contains(github.event.head_commit.message, 'D1.8c4') || contains(github.event.head_commit.message, 'D1.8c5') || contains(github.event.head_commit.message, 'D1.8c6') || contains(github.event.head_commit.message, 'D1.8c7') || contains(github.event.head_commit.message, 'D1.8d') || contains(github.event.head_commit.message, 'D1.8e') || contains(github.event.head_commit.message, 'D1.8f') || contains(github.event.head_commit.message, 'D1.10a')
        run: |
          cargo build --locked --offline --release -p rpmodel --example verify_package
          "$RUNNER_TEMP/rp-convert/bin/python" crates/rpinfer/tests/check_package_integrity.py "$RUNNER_TEMP/rpmodel-v1" target/release/examples/verify_package
      - name: Bind real typed Marian architecture and search profile
        if: contains(github.event.head_commit.message, 'D1.8c2b') || contains(github.event.head_commit.message, 'D1.8c3') || contains(github.event.head_commit.message, 'D1.8c4') || contains(github.event.head_commit.message, 'D1.8c5') || contains(github.event.head_commit.message, 'D1.8c6') || contains(github.event.head_commit.message, 'D1.8c7') || contains(github.event.head_commit.message, 'D1.8d') || contains(github.event.head_commit.message, 'D1.8e') || contains(github.event.head_commit.message, 'D1.8f') || contains(github.event.head_commit.message, 'D1.10a')
        run: |
          cargo build --locked --offline --release -p rpinfer --example verify_marian_profile
          target/release/examples/verify_marian_profile "$RUNNER_TEMP/rpmodel-v1"
      - name: Compare real shared embeddings and tied LM head
        if: contains(github.event.head_commit.message, 'D1.8c3') || contains(github.event.head_commit.message, 'D1.8c4') || contains(github.event.head_commit.message, 'D1.8c5') || contains(github.event.head_commit.message, 'D1.8c6') || contains(github.event.head_commit.message, 'D1.8c7') || contains(github.event.head_commit.message, 'D1.8d') || contains(github.event.head_commit.message, 'D1.8e') || contains(github.event.head_commit.message, 'D1.8f') || contains(github.event.head_commit.message, 'D1.10a')
        run: |
          cargo build --locked --offline --release -p rpinfer --example real_embedding_reference
          "$RUNNER_TEMP/rp-convert/bin/python" crates/rpinfer/tests/check_real_embeddings.py "$RUNNER_TEMP/opus-source" "$RUNNER_TEMP/rpmodel-v1" target/release/examples/real_embedding_reference
      - name: Compare actual six-layer Marian encoder
        if: contains(github.event.head_commit.message, 'D1.8c4') || contains(github.event.head_commit.message, 'D1.8c5') || contains(github.event.head_commit.message, 'D1.8c6') || contains(github.event.head_commit.message, 'D1.8c7') || contains(github.event.head_commit.message, 'D1.8d') || contains(github.event.head_commit.message, 'D1.8e') || contains(github.event.head_commit.message, 'D1.8f') || contains(github.event.head_commit.message, 'D1.10a')
        run: |
          "$RUNNER_TEMP/rp-convert/bin/pip" install --disable-pip-version-check --only-binary=:all: transformers==4.48.3
          cargo build --locked --offline --release -p rpinfer --example real_encoder_reference
          "$RUNNER_TEMP/rp-convert/bin/python" crates/rpinfer/tests/check_real_encoder.py "$RUNNER_TEMP/opus-source" "$RUNNER_TEMP/rpmodel-v1" target/release/examples/real_encoder_reference
      - name: Compare actual six-layer decoder and full model logits
        if: contains(github.event.head_commit.message, 'D1.8c5') || contains(github.event.head_commit.message, 'D1.8c6') || contains(github.event.head_commit.message, 'D1.8c7') || contains(github.event.head_commit.message, 'D1.8d') || contains(github.event.head_commit.message, 'D1.8e') || contains(github.event.head_commit.message, 'D1.8f') || contains(github.event.head_commit.message, 'D1.10a')
        run: |
          cargo build --locked --offline --release -p rpinfer --example real_decoder_reference
          "$RUNNER_TEMP/rp-convert/bin/python" crates/rpinfer/tests/check_real_decoder.py "$RUNNER_TEMP/opus-source" "$RUNNER_TEMP/rpmodel-v1" target/release/examples/real_decoder_reference
      - name: Compare actual cached logits and bounded beam generation
        if: contains(github.event.head_commit.message, 'D1.8c6') || contains(github.event.head_commit.message, 'D1.8c7') || contains(github.event.head_commit.message, 'D1.8d') || contains(github.event.head_commit.message, 'D1.8e') || contains(github.event.head_commit.message, 'D1.8f') || contains(github.event.head_commit.message, 'D1.10a')
        run: |
          cargo build --locked --offline --release -p rpinfer --example real_generation_reference
          "$RUNNER_TEMP/rp-convert/bin/python" crates/rpinfer/tests/check_real_generation.py "$RUNNER_TEMP/opus-source" "$RUNNER_TEMP/rpmodel-v1" target/release/examples/real_generation_reference
      - name: Verify owning model lifecycle and unified token API
        if: contains(github.event.head_commit.message, 'D1.8c7') || contains(github.event.head_commit.message, 'D1.8d') || contains(github.event.head_commit.message, 'D1.8e') || contains(github.event.head_commit.message, 'D1.8f') || contains(github.event.head_commit.message, 'D1.10a')
        run: |
          cargo build --locked --offline --release -p rpinfer --example verify_full_model
          target/release/examples/verify_full_model "$RUNNER_TEMP/rpmodel-v1"
      - name: Compare actual model across CPU kernels and maximum positions
        if: contains(github.event.head_commit.message, 'D1.8d') || contains(github.event.head_commit.message, 'D1.8e') || contains(github.event.head_commit.message, 'D1.8f') || contains(github.event.head_commit.message, 'D1.10a')
        run: |
          cargo build --locked --offline --release -p rpinfer --example real_kernel_reference
          "$RUNNER_TEMP/rp-convert/bin/python" crates/rpinfer/tests/check_real_kernels.py "$RUNNER_TEMP/opus-source" "$RUNNER_TEMP/rpmodel-v1" target/release/examples/real_kernel_reference native
      - name: Compare actual model with forced portable backend
        if: contains(github.event.head_commit.message, 'D1.8d') || contains(github.event.head_commit.message, 'D1.8e') || contains(github.event.head_commit.message, 'D1.8f') || contains(github.event.head_commit.message, 'D1.10a')
        run: |
          cargo build --locked --offline --release -p rpinfer --features portable-only --example real_kernel_reference
          "$RUNNER_TEMP/rp-convert/bin/python" crates/rpinfer/tests/check_real_kernels.py "$RUNNER_TEMP/opus-source" "$RUNNER_TEMP/rpmodel-v1" target/release/examples/real_kernel_reference portable
      - name: Translate actual English sentences entirely through Rust
        if: contains(github.event.head_commit.message, 'D1.8e') || contains(github.event.head_commit.message, 'D1.8f') || contains(github.event.head_commit.message, 'D1.10a')
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          "$RUNNER_TEMP/rp-convert/bin/pip" install --disable-pip-version-check --only-binary=:all: sentencepiece==0.2.1
          cargo build --locked --offline --release -p rptranslate --example real_translation_reference
          cargo build --locked --offline --release -p rptranslate
          "$RUNNER_TEMP/rp-convert/bin/python" crates/rptranslate/tests/check_real_translation.py "$RUNNER_TEMP/opus-source" "$RUNNER_TEMP/rpmodel-v1" target/release/examples/real_translation_reference target/release/rptranslate
      - name: Measure offline translation CPU latency memory and quality baseline
        if: contains(github.event.head_commit.message, 'D1.8f') || contains(github.event.head_commit.message, 'D1.10a')
        run: |
          lscpu | grep -E 'Model name:|^CPU\(s\):' || true
          cargo build --locked --offline --release -p rptranslate --example benchmark_translation
          "$RUNNER_TEMP/rp-convert/bin/python" crates/rptranslate/tests/check_translation_baseline.py "$RUNNER_TEMP/rpmodel-v1" target/release/examples/benchmark_translation
      - name: Compare actual packed shared vocabulary and tied projection
        if: contains(github.event.head_commit.message, 'D1.9c') || contains(github.event.head_commit.message, 'D1.9d') || contains(github.event.head_commit.message, 'D1.9e') || contains(github.event.head_commit.message, 'D1.9f') || contains(github.event.head_commit.message, 'D1.9g') || contains(github.event.head_commit.message, 'D1.9h') || contains(github.event.head_commit.message, 'D1.10a')
        run: |
          cargo build --locked --offline --release -p rpinfer --example real_quantized_table
          "$RUNNER_TEMP/rp-convert/bin/python" crates/rpinfer/tests/check_real_quantized_table.py "$RUNNER_TEMP/opus-source" "$RUNNER_TEMP/rpmodel-v1" target/release/examples/real_quantized_table
      - name: Compare actual INT8 linear integer dots and mixed accumulation
        if: contains(github.event.head_commit.message, 'D1.9d') || contains(github.event.head_commit.message, 'D1.9e') || contains(github.event.head_commit.message, 'D1.9f') || contains(github.event.head_commit.message, 'D1.9g') || contains(github.event.head_commit.message, 'D1.9h') || contains(github.event.head_commit.message, 'D1.10a')
        run: |
          cargo build --locked --offline --release -p rpinfer --example real_int8_linear
          "$RUNNER_TEMP/rp-convert/bin/python" crates/rpinfer/tests/check_real_int8_linear.py "$RUNNER_TEMP/opus-source" "$RUNNER_TEMP/rpmodel-v1" target/release/examples/real_int8_linear
      - name: Benchmark actual INT8 Linear with AVX2 and portable fallback
        if: contains(github.event.head_commit.message, 'D1.9e') || contains(github.event.head_commit.message, 'D1.9f') || contains(github.event.head_commit.message, 'D1.9g') || contains(github.event.head_commit.message, 'D1.9h') || contains(github.event.head_commit.message, 'D1.10a')
        run: |
          lscpu | grep -E 'Model name:|^CPU\(s\):' || true
          cargo build --locked --offline --release -p rpinfer --example int8_simd_bench
          target/release/examples/int8_simd_bench "$RUNNER_TEMP/rpmodel-v1" native
          cargo build --locked --offline --release -p rpinfer --features portable-only --example int8_simd_bench
          target/release/examples/int8_simd_bench "$RUNNER_TEMP/rpmodel-v1" portable
      - name: Convert and verify full actual INT8 mixed model package
        if: contains(github.event.head_commit.message, 'D1.9f') || contains(github.event.head_commit.message, 'D1.9g') || contains(github.event.head_commit.message, 'D1.9h') || contains(github.event.head_commit.message, 'D1.10a')
        run: |
          cargo build --locked --offline --release -p rpinfer --example mixed_model_reference
          "$RUNNER_TEMP/rp-convert/bin/python" crates/rpinfer/tests/check_mixed_model.py "$RUNNER_TEMP/opus-source" "$RUNNER_TEMP/rpmodel-v1" target/release/examples/mixed_model_reference
      - name: Verify complete mixed Marian forward cache search and text
        if: contains(github.event.head_commit.message, 'D1.9g') || contains(github.event.head_commit.message, 'D1.9h') || contains(github.event.head_commit.message, 'D1.10a')
        run: |
          cargo build --locked --offline --release -p rpinfer --example mixed_inference_reference --example mixed_model_reference
          target/release/examples/mixed_model_reference convert "$RUNNER_TEMP/rpmodel-v1" "$RUNNER_TEMP/rpmodel-mixed"
          "$RUNNER_TEMP/rp-convert/bin/python" crates/rpinfer/tests/check_mixed_inference.py "$RUNNER_TEMP/opus-source" "$RUNNER_TEMP/rpmodel-mixed" "$RUNNER_TEMP/rpmodel-v1" target/release/examples/mixed_inference_reference
      - name: Compare complete offline FP32 and INT8 translation performance and quality
        if: contains(github.event.head_commit.message, 'D1.9h') || contains(github.event.head_commit.message, 'D1.10a')
        run: |
          lscpu | grep -E 'Model name:|^CPU\(s\):' || true
          cargo build --locked --offline --release -p rptranslate --example benchmark_translation
          cargo build --locked --offline --release -p rptranslate
          "$RUNNER_TEMP/rp-convert/bin/python" crates/rptranslate/tests/check_paired_translation.py "$RUNNER_TEMP/rpmodel-v1" "$RUNNER_TEMP/rpmodel-mixed" target/release/examples/benchmark_translation target/release/rptranslate
      - name: Measure uploaded paper through the unchanged Rust engine
        if: contains(github.event.head_commit.message, 'D1.9h-paper')
        run: |
          set -eu
          paper="$RUNNER_TEMP/rp-paper"
          mkdir -p "$paper"
          curl --fail --location --max-time 90 --max-filesize 20000000 --output "$paper/source.pdf" "https://eartharxiv.org/repository/object/2772/download/7222/"
          "$RUNNER_TEMP/rp-convert/bin/pip" install --disable-pip-version-check --only-binary=:all: PyMuPDF==1.26.7
          "$RUNNER_TEMP/rp-convert/bin/python" crates/rptranslate/tests/benchmark_paper.py prepare "$paper/source.pdf" "$paper"
          cargo build --locked --offline --release -p rptranslate --example benchmark_paper
          /usr/bin/time -f %M -o "$paper/int8.rss" target/release/examples/benchmark_paper "$RUNNER_TEMP/rpmodel-mixed" int8 "$paper/full.tsv" > "$paper/int8.out"
          /usr/bin/time -f %M -o "$paper/fp32.rss" target/release/examples/benchmark_paper "$RUNNER_TEMP/rpmodel-v1" fp32 "$paper/sample.tsv" > "$paper/fp32.out"
          "$RUNNER_TEMP/rp-convert/bin/python" crates/rptranslate/tests/benchmark_paper.py report "$paper"
      - name: Verify scientific protected translation through actual FP32 and INT8 models
        if: contains(github.event.head_commit.message, 'D1.10b')
        run: |
          set -eu
          paper="$RUNNER_TEMP/rp-paper"
          cargo build --locked --offline --release -p rptranslate --example scientific_reference
          target/release/examples/scientific_reference "$RUNNER_TEMP/rpmodel-v1" fp32
          /usr/bin/time -f %M -o "$paper/scientific.rss" target/release/examples/scientific_reference "$RUNNER_TEMP/rpmodel-mixed" int8 "$paper/full.tsv" > "$paper/scientific.out"
          "$RUNNER_TEMP/rp-convert/bin/python" crates/rptranslate/tests/check_scientific_paper.py "$paper"
          target/release/rptranslate translate-scientific-int8 "$RUNNER_TEMP/rpmodel-mixed" 'The peak acceleration is 0.1 g.' 1 64 | grep -F '0.1 g'
          if target/release/rptranslate translate-scientific-int8 "$RUNNER_TEMP/rpmodel-mixed" 'broken $x' 1 64; then exit 1; fi

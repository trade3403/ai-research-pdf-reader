name: RPCore bootstrap CI
on:
  push:
    branches: [feature/rpcore-bootstrap, main]
    paths: ['rpcore/**', '.github/workflows/rpcore-ci.yml']
  pull_request:
    paths: ['rpcore/**', '.github/workflows/rpcore-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rpcore/Cargo.toml --locked
      - run: cargo build --manifest-path rpcore/Cargo.toml --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: rpcore-${{ matrix.os }}
          path: |
            rpcore/target/release/rpcore
            rpcore/target/release/rpcore.exe
          if-no-files-found: error
      - run: cargo run --manifest-path rpcore/Cargo.toml --release --locked --example render_demo -- rpcore/target/render-demo
      - run: cargo run --manifest-path rpcore/Cargo.toml --release --locked --example truetype_demo -- rpcore/target/render-demo
      - run: cargo run --manifest-path rpcore/Cargo.toml --release --locked --example cff_demo -- rpcore/target/render-demo
      - run: cargo run --manifest-path rpcore/Cargo.toml --release --locked --example type1_demo -- rpcore/target/render-demo
      - run: cargo run --manifest-path rpcore/Cargo.toml --release --locked --example image_demo -- rpcore/target/render-demo
      - run: cargo run --manifest-path rpcore/Cargo.toml --release --locked --example group_demo -- rpcore/target/render-demo
      - uses: actions/upload-artifact@v4
        with:
          name: rpcore-render-demo-${{ matrix.os }}
          path: rpcore/target/render-demo/
          if-no-files-found: error

  corpus:
    # Separate observational Linux job: routine cross-platform unit tests stay independent.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --manifest-path rpcore/Cargo.toml --release --locked --example corpus_probe --example render_demo
      - run: rpcore/target/release/examples/render_demo rpcore/target/corpus-smoke
      - run: python3 rpcore/corpus/run.py --probe rpcore/target/release/examples/corpus_probe --out rpcore/target/corpus-smoke-report --local rpcore/target/corpus-smoke/rpcore-vector-demo.pdf --require-success
      - run: python3 rpcore/corpus/run.py --probe rpcore/target/release/examples/corpus_probe --out rpcore/target/corpus-report
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpcore-real-paper-corpus
          path: |
            rpcore/target/corpus-report/report.json
            rpcore/target/corpus-report/report.md
            rpcore/target/corpus-smoke-report/report.json
          if-no-files-found: warn
      - if: always()
        run: |
          if [ -f rpcore/target/corpus-report/report.md ]; then cat rpcore/target/corpus-report/report.md >> "$GITHUB_STEP_SUMMARY"; fi

  corpus-fonts:
    # Optional explicit font assets, never bundled into RPCore release artifacts.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-urw-base35
      - run: |
          mkdir -p rpcore/target/font-report
          dpkg-query -W fonts-urw-base35 > rpcore/target/font-report/font-package.txt
          sha256sum /usr/share/fonts/opentype/urw-base35/*.otf > rpcore/target/font-report/font-sha256.txt
      - run: cargo build --manifest-path rpcore/Cargo.toml --release --locked --example corpus_probe
      - run: python3 rpcore/corpus/run.py --probe rpcore/target/release/examples/corpus_probe --out rpcore/target/font-report --font-dir /usr/share/fonts/opentype/urw-base35
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpcore-explicit-font-corpus
          path: rpcore/target/font-report/
          if-no-files-found: warn
      - if: always()
        run: |
          if [ -f rpcore/target/font-report/report.md ]; then cat rpcore/target/font-report/report.md >> "$GITHUB_STEP_SUMMARY"; fi

  corpus-visual:
    # Reference engine and Pillow are test-only dependencies. Never packaged.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils python3-pil fonts-urw-base35
      - run: /usr/bin/python3 rpcore/corpus/test_visual.py
      - run: cargo build --manifest-path rpcore/Cargo.toml --release --locked --example corpus_probe --example render_demo
      - run: |
          rpcore/target/release/examples/render_demo rpcore/target/visual-smoke
          /usr/bin/python3 rpcore/corpus/visual.py --probe rpcore/target/release/examples/corpus_probe --reference /usr/bin/pdftoppm --out rpcore/target/visual-smoke-report --local rpcore/target/visual-smoke/rpcore-vector-demo.pdf --save-images
      - run: |
          mkdir -p rpcore/target/visual-report
          dpkg-query -W fonts-urw-base35 poppler-utils python3-pil > rpcore/target/visual-report/test-package-versions.txt
          sha256sum /usr/share/fonts/opentype/urw-base35/*.otf > rpcore/target/visual-report/font-sha256.txt
          /usr/bin/python3 rpcore/corpus/visual.py --probe rpcore/target/release/examples/corpus_probe --reference /usr/bin/pdftoppm --out rpcore/target/visual-report --font-dir /usr/share/fonts/opentype/urw-base35
      - if: always()
        run: |
          mkdir -p rpcore/target/visual-72dpi-report
          dpkg-query -W fonts-urw-base35 poppler-utils python3-pil > rpcore/target/visual-72dpi-report/test-package-versions.txt
          sha256sum /usr/share/fonts/opentype/urw-base35/*.otf > rpcore/target/visual-72dpi-report/font-sha256.txt
          /usr/bin/python3 rpcore/corpus/visual.py --probe rpcore/target/release/examples/corpus_probe --reference /usr/bin/pdftoppm --out rpcore/target/visual-72dpi-report --font-dir /usr/share/fonts/opentype/urw-base35 --dpi 72
      - if: always()
        run: |
          mkdir -p rpcore/target/visual-fine-72dpi-report
          dpkg-query -W fonts-urw-base35 poppler-utils python3-pil > rpcore/target/visual-fine-72dpi-report/test-package-versions.txt
          sha256sum /usr/share/fonts/opentype/urw-base35/*.otf > rpcore/target/visual-fine-72dpi-report/font-sha256.txt
          /usr/bin/python3 rpcore/corpus/visual.py --probe rpcore/target/release/examples/corpus_probe --reference /usr/bin/pdftoppm --out rpcore/target/visual-fine-72dpi-report --font-dir /usr/share/fonts/opentype/urw-base35 --dpi 72 --text-aa 4
      - if: always()
        run: |
          mkdir -p rpcore/target/visual-grid-72dpi-report
          dpkg-query -W fonts-urw-base35 poppler-utils python3-pil > rpcore/target/visual-grid-72dpi-report/test-package-versions.txt
          sha256sum /usr/share/fonts/opentype/urw-base35/*.otf > rpcore/target/visual-grid-72dpi-report/font-sha256.txt
          /usr/bin/python3 rpcore/corpus/visual.py --probe rpcore/target/release/examples/corpus_probe --reference /usr/bin/pdftoppm --out rpcore/target/visual-grid-72dpi-report --font-dir /usr/share/fonts/opentype/urw-base35 --dpi 72 --text-aa 4 --text-grid
      - if: always()
        run: |
          mkdir -p rpcore/target/visual-area-72dpi-report
          dpkg-query -W fonts-urw-base35 poppler-utils python3-pil > rpcore/target/visual-area-72dpi-report/test-package-versions.txt
          sha256sum /usr/share/fonts/opentype/urw-base35/*.otf > rpcore/target/visual-area-72dpi-report/font-sha256.txt
          /usr/bin/python3 rpcore/corpus/visual.py --probe rpcore/target/release/examples/corpus_probe --reference /usr/bin/pdftoppm --out rpcore/target/visual-area-72dpi-report --font-dir /usr/share/fonts/opentype/urw-base35 --dpi 72 --text-aa 4 --text-area
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpcore-visual-comparison
          path: |
            rpcore/target/visual-report/
            rpcore/target/visual-smoke-report/
            rpcore/target/visual-72dpi-report/
            rpcore/target/visual-fine-72dpi-report/
            rpcore/target/visual-grid-72dpi-report/
            rpcore/target/visual-area-72dpi-report/
          if-no-files-found: warn
      - if: always()
        run: |
          if [ -f rpcore/target/visual-report/report.md ]; then cat rpcore/target/visual-report/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f rpcore/target/visual-72dpi-report/report.md ]; then cat rpcore/target/visual-72dpi-report/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f rpcore/target/visual-fine-72dpi-report/report.md ]; then cat rpcore/target/visual-fine-72dpi-report/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f rpcore/target/visual-grid-72dpi-report/report.md ]; then cat rpcore/target/visual-grid-72dpi-report/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f rpcore/target/visual-area-72dpi-report/report.md ]; then cat rpcore/target/visual-area-72dpi-report/report.md >> "$GITHUB_STEP_SUMMARY"; fi

  corpus-formulas:
    # Observational transcription benchmark, independent of raster quality.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-urw-base35
      - run: python3 rpcore/corpus/test_formula_benchmark.py
      - run: cargo build --manifest-path rpcore/Cargo.toml --release --locked --example corpus_probe
      - run: |
          mkdir -p rpcore/target/formula-report
          dpkg-query -W fonts-urw-base35 > rpcore/target/formula-report/font-package.txt
          sha256sum /usr/share/fonts/opentype/urw-base35/*.otf > rpcore/target/formula-report/font-sha256.txt
          python3 rpcore/corpus/formula_benchmark.py --probe rpcore/target/release/examples/corpus_probe --out rpcore/target/formula-report --font-dir /usr/share/fonts/opentype/urw-base35
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpcore-real-paper-formulas
          path: rpcore/target/formula-report/
          if-no-files-found: warn
      - if: always()
        run: |
          if [ -f rpcore/target/formula-report/report.md ]; then cat rpcore/target/formula-report/report.md >> "$GITHUB_STEP_SUMMARY"; fi

name: Electron preview Windows build
on:
  push:
    branches: [feature/electron-migration, main]
    paths: ['electron-preview/**', 'src/**', '.github/workflows/electron-preview-ci.yml']
  pull_request:
    paths: ['electron-preview/**', 'src/**', '.github/workflows/electron-preview-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: electron-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build existing React workspace
        working-directory: .
        run: |
          npm install --no-audit --no-fund
          npm run build
      - run: npm install --no-audit --no-fund
      - run: npm run workspace
      - name: Actual Electron GUI smoke and capture
        run: npm run test:gui
      - name: Encode GUI capture
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress; $env:Path += ';C:\ProgramData\chocolatey\bin' }
          ffmpeg -y -framerate 2 -i gui-evidence/frame-%05d.png -c:v libx264 -vf "pad=ceil(iw/2)*2:ceil(ih/2)*2" -pix_fmt yuv420p gui-evidence/gui-demo.mp4
          if ($LASTEXITCODE -ne 0) { throw 'GUI video encoding failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electron-real-gui-evidence
          path: electron-preview/gui-evidence/
          if-no-files-found: warn
      - run: npm test
      - run: node --check main.cjs
      - run: node --check preload.cjs
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check installer and generate SHA256
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -Filter '*.exe' -File)
          if ($files.Count -eq 0) { throw 'No installer' }
          $files | ForEach-Object { "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: electron-preview-windows-x64
          path: |
            electron-preview/dist/*.exe
            electron-preview/dist/SHA256SUMS.txt
            electron-preview/package-lock.json
          if-no-files-found: error

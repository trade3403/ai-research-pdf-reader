name: Build and Publish Windows Installer
run-name: Windows installer · ${{ github.ref_name }} · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  statuses: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Check V0.2 source structure
        run: npm run test:v02
      - name: Check V0.3 source structure
        run: npm run test:v03
      - name: Check V0.4 UI, native webview isolation and research archive
        run: npm run test:v04
      - name: Check Markdown and LaTeX rendering
        run: npm run test:math
      - name: Check Azure translation, markup protection and quota architecture
        run: npm run test:translation
      - name: Check V0.4.3 context menu and backup
        run: npm run test:v043
      - name: Check V0.5 Word editor, DOCX import/export and data migration
        run: npm run test:v05
      - name: Check V0.5.1 numbering, cross-references and migrations
        run: npm run test:v051
      - name: Check V0.5.2 WebView lifecycle and resize UI
        run: npm run test:v052
      - name: Check V0.5.3 user-confirmed ChatGPT draft insertion and PDF collapse
        run: npm run test:v053
      - name: Check V0.5.4 layout persistence and keyboard shortcuts
        run: npm run test:v054
      - name: Check native ChatGPT WebView2 right-dock geometry
        run: npm run test:webview-geometry
      - name: Validate stable release tag
        run: node scripts/validate-release.mjs
      - name: Check V0.5.7 PDF-scoped prompts and collapsible pane
        run: npm run test:v057
      - name: Check V0.5.9 PDF text selection and search stability
        run: npm run test:v059
      - name: Build NSIS setup EXE
        run: npm run tauri:build
      - name: Verify PE executable and write SHA256
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          $files = @(Get-ChildItem $dir -Filter "*.exe" -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw "NSIS Setup.exe was not generated." }
          foreach ($f in $files) {
            $stream = [System.IO.File]::OpenRead($f.FullName)
            try {
              $header = New-Object byte[] 2
              $read = $stream.Read($header, 0, 2)
              if ($read -ne 2 -or $header[0] -ne 77 -or $header[1] -ne 90) { throw "Not a Windows PE EXE: $($f.Name)" }
            } finally { $stream.Dispose() }
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($f.Name)" | Out-File -FilePath "$dir/SHA256SUMS.txt" -Encoding ascii -Append
            Write-Host "Built: $($f.Name) / $($f.Length) bytes / SHA256=$hash"
          }
      - name: Save installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Research-PDF-Reader-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -ExpandProperty FullName)
          $assets += (Resolve-Path "src-tauri/target/release/bundle/nsis/SHA256SUMS.txt").Path
          gh release create $tag $assets --title "AI Research PDF Reader $tag" --notes "Windows x64 NSIS installer. Unsigned development release; use only if you trust this repository." --verify-tag

  build-result-status:
    name: Report Windows build result to commit status
    if: always()
    needs: [windows-installer]
    runs-on: ubuntu-latest
    steps:
      - name: Publish machine-readable build status and run URL
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_RESULT: ${{ needs.windows-installer.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUN_RESULT" == "success" ]]; then
            state=success
            description="Windows installer CI passed; check run artifacts"
          else
            state=failure
            description="Windows installer CI did not pass: $RUN_RESULT"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context="AI Research Studio / Windows Installer" \
            -f description="$description" \
            -f target_url="$RUN_URL"

name: RWCore CI

on:
  push:
    branches: [main]
    paths:
      - 'rwcore/**'
      - '.github/workflows/rwcore-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rwcore/**'
      - '.github/workflows/rwcore-ci.yml'

permissions:
  contents: read

# One CI source for the active development PR; no duplicate branch-push run.
concurrency:
  group: rwcore-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rwcore
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested revision
        run: git rev-parse HEAD
      - name: Rust toolchain
        run: rustup update stable
      - name: Resolve dependencies (until lockfile is committed)
        run: cargo +stable generate-lockfile
        if: ${{ hashFiles('rwcore/Cargo.lock') == '' }}
      - name: Dependency tree
        run: cargo +stable tree --locked
      - name: Prepare native DejaVu reference font (test only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update
            sudo apt-get install -y fonts-dejavu-core
          fi
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          dpkg-query -W fonts-dejavu-core || true
          sha256sum /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          echo "RWCORE_DEJAVU_REFERENCE=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf" >> "$GITHUB_ENV"
      - name: Test
        run: cargo +stable test --locked --workspace --all-targets
      - name: Report native joint ligature inventory
        if: matrix.os == 'ubuntu-latest'
        run: |
          cat target/native-joint-ligature.txt
          grep -Fx 'DEJAVU_JOINT_REFERENCE cases=4 direction_checks=8 nonzero_direction_checks=8 max_absolute_error=0' target/native-joint-ligature.txt
      - name: Report retained Arabic native scope
        if: matrix.os == 'ubuntu-latest'
        run: |
          cat target/arabic-native-scope.txt
          test "$(wc -l < target/arabic-native-scope.txt)" -eq 49
      - name: Build
        run: cargo +stable build --locked --workspace --release
      - name: HarfBuzz external GPOS reference (test only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! python3 -c 'import ctypes.util; assert ctypes.util.find_library("harfbuzz")'; then
            sudo apt-get update
            sudo apt-get install -y libharfbuzz0b
          fi
          cargo +stable build --locked -p rwcore --release --example gpos_reference_probe
          python3 tools/harfbuzz_gpos_reference.py --probe target/release/examples/gpos_reference_probe --report target/harfbuzz-gpos-reference.json
      - name: HarfBuzz external Mark reference (test only)
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/harfbuzz_mark_reference.py --probe target/release/examples/gpos_reference_probe --report target/harfbuzz-mark-reference.json
      - name: HarfBuzz external stacked Mark reference (test only)
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/harfbuzz_stack_reference.py --probe target/release/examples/gpos_reference_probe --report target/harfbuzz-stack-reference.json
      - name: RTL acceptance policy regression tests
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/test_harfbuzz_rtl_gate.py
      - name: HarfBuzz external Arabic RTL exact gate (test only)
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/harfbuzz_rtl_reference.py --probe target/release/examples/gpos_reference_probe --report target/harfbuzz-rtl-reference.json
      - name: Preserve HarfBuzz Arabic RTL reference report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rwcore-harfbuzz-rtl-reference
          path: rwcore/target/harfbuzz-rtl-reference.json
          if-no-files-found: warn
      - name: Preserve HarfBuzz stacked Mark reference report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rwcore-harfbuzz-stack-reference
          path: rwcore/target/harfbuzz-stack-reference.json
          if-no-files-found: warn
      - name: Preserve HarfBuzz Mark reference report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rwcore-harfbuzz-mark-reference
          path: rwcore/target/harfbuzz-mark-reference.json
          if-no-files-found: warn
      - name: Preserve HarfBuzz GPOS reference report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rwcore-harfbuzz-gpos-reference
          path: rwcore/target/harfbuzz-gpos-reference.json
          if-no-files-found: warn
      - name: Preserve resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwcore-lock-${{ matrix.os }}
          path: rwcore/Cargo.lock
          if-no-files-found: warn

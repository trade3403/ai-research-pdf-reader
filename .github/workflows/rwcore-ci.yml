name: RWCore CI

on:
  push:
    branches: [main]
    paths:
      - 'rwcore/**'
      - '.github/workflows/rwcore-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rwcore/**'
      - '.github/workflows/rwcore-ci.yml'

permissions:
  contents: read

# One CI source for the active development PR; no duplicate branch-push run.
concurrency:
  group: rwcore-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rwcore
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested revision
        run: git rev-parse HEAD
      - name: Rust toolchain
        run: rustup update stable
      - name: Resolve dependencies (until lockfile is committed)
        run: cargo +stable generate-lockfile
        if: ${{ hashFiles('rwcore/Cargo.lock') == '' }}
      - name: Dependency tree
        run: cargo +stable tree --locked
      - name: Test
        run: cargo +stable test --locked --workspace --all-targets
      - name: Build
        run: cargo +stable build --locked --workspace --release
      - name: Preserve resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwcore-lock-${{ matrix.os }}
          path: rwcore/Cargo.lock
          if-no-files-found: warn
